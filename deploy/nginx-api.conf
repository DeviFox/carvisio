# api.carvisio.pro → Go API on localhost.
# certbot adds the HTTPS server block and the http→https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api.carvisio.pro;

    client_max_body_size 2m;

    # Photos and PDFs of documents; the model takes up to a minute on a long one.
    location = /api/recognize {
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
